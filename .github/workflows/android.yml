name: Android app (unsigned)

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned AAB and APK
        run: gradle -p android bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Align APK and collect the signing tool
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir out
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/app-release-unsigned-aligned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          cp "$BT/lib/apksigner.jar" out/
      - uses: actions/upload-artifact@v4
        with:
          name: vizviz-unsigned
          path: out/
      # Also publish the unsigned files on a separate branch so they can be fetched with plain git and signed offline.
      - name: Push unsigned files to the android-build branch
        run: |
          cd out
          git init -q -b android-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Unsigned build of ${GITHUB_SHA}" > README.md
          git add -A && git commit -qm "Unsigned Android build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-build

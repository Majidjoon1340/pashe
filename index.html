<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>وزوز: حمله از هر طرف</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #f4f1ea;
    --accent: #ffcf3f;
    --danger: #ff3b3b;
    --muted: #a8a59c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  body.xr { background: transparent; }
  #cam, #fallbackBg {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
    transition: filter .4s;
  }
  #fallbackBg {
    background: radial-gradient(ellipse at 50% 40%, #3a3f47 0%, #1b1e23 60%, #0b0d10 100%);
    display: none;
  }
  #overlay { position: fixed; inset: 0; z-index: 1; }
  #game, #gl3d { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gl3d { pointer-events: none; }
  #flash {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0) 30%, rgba(255,0,0,.75) 100%);
    transition: opacity .35s;
  }
  #hud {
    position: absolute; bottom: 0; left: 0; right: 0; pointer-events: none;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 12px);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .stat { font-size: 15px; line-height: 1.6; min-width: 120px; }
  #exitBtn {
    pointer-events: auto; font: inherit; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.5); border-radius: 22px; padding: 8px 22px; margin-bottom: 4px;
  }
  .stat b { color: var(--accent); font-size: 20px; }
  #healthWrap { width: 120px; height: 12px; border-radius: 6px; background: rgba(0,0,0,.5); overflow: hidden; border: 1px solid rgba(255,255,255,.4); margin-top: 4px; }
  #timer { font-size: 18px; color: var(--accent); font-weight: 700; margin-top: 2px; }
  #health { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4d4d, #ffcf3f); transition: width .25s; }
  #banner {
    position: absolute; top: 36%; left: 16px; right: 16px; text-align: center; pointer-events: none;
    font-size: 30px; font-weight: 800; color: var(--accent); text-shadow: 0 2px 8px rgba(0,0,0,.9);
    opacity: 0; transition: opacity .4s; line-height: 1.6;
  }
  #power {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; pointer-events: none;
    background: rgba(0,0,0,.5); border: 1px solid rgba(120,255,200,.6); color: #b8ffe0; border-radius: 16px;
    padding: 6px 14px; font-size: 15px; font-weight: 700; text-shadow: 0 1px 3px #000;
  }
  #banner small { display: block; font-size: 16px; color: #fff; font-weight: 600; }
  #hint {
    position: absolute; bottom: calc(env(safe-area-inset-bottom) + 92px); right: 16px; left: 16px; text-align: center;
    pointer-events: none; font-size: 14px; color: #fff; text-shadow: 0 1px 4px #000; line-height: 1.6;
  }
  .screen {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: calc(env(safe-area-inset-top) + 44px) 16px calc(env(safe-area-inset-bottom) + 24px); text-align: center; background: rgba(8,9,12,.92); overflow-y: auto;
  }
  /* centred when it fits, top-aligned (never under the camera notch) when it doesn't */
  .screen > :first-child { margin-top: auto !important; }
  .screen > :last-child { margin-bottom: auto !important; }
  .screen h1 { font-size: 38px; margin: 0 0 6px; color: var(--accent); }
  .screen p { max-width: 440px; color: var(--fg); line-height: 1.9; margin: 6px 0; font-size: 15px; }
  .screen .small { color: var(--muted); font-size: 13px; }
  button.big {
    margin-top: 16px; font: inherit; font-size: 20px; font-weight: 700; padding: 14px 40px; border-radius: 40px; border: 0;
    background: var(--accent); color: #1a1500; cursor: pointer; box-shadow: 0 4px 18px rgba(255,207,63,.35);
  }
  .sizes { display: flex; gap: 8px; margin: 10px 0 2px; flex-wrap: wrap; justify-content: center; }
  .sizes button {
    font: inherit; font-size: 15px; padding: 9px 14px; border-radius: 20px; cursor: pointer;
    background: transparent; color: var(--fg); border: 1px solid rgba(255,255,255,.35);
  }
  .sizes button.on { background: rgba(255,207,63,.18); border-color: var(--accent); color: var(--accent); }
  #modeNote { color: #9fe3a8; }
  .home { padding-top: calc(env(safe-area-inset-top) + 64px) !important; }
  .home .logo { margin-top: auto; }
  .home {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255,207,63,.22), transparent 60%),
      radial-gradient(90% 50% at 100% 110%, rgba(60,160,255,.18), transparent 60%),
      linear-gradient(180deg, #10131a 0%, #07080b 100%);
    gap: 12px;
  }
  .homeTop { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; margin: 0 !important; }
  .iconBtn {
    width: 40px; height: 40px; border-radius: 50%; font: inherit; font-size: 20px; font-weight: 800; cursor: pointer;
    color: var(--accent); background: rgba(255,255,255,.06); border: 1px solid rgba(255,207,63,.5);
  }
  .best { font-size: 13px; color: var(--accent); background: rgba(255,207,63,.1); border-radius: 14px; padding: 4px 12px; }
  .best:empty { display: none; }
  .logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; }
  .logoImg { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 8px 30px rgba(255,207,63,.25), 0 0 0 1px rgba(255,255,255,.08); animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .logo h1 { font-size: 44px; margin: 8px 0 0; letter-spacing: 1px; background: linear-gradient(180deg, #ffe58a, #ffb81f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { color: var(--muted); font-size: 13px; margin-top: -2px; }
  .card {
    width: 100%; max-width: 420px; padding: 12px; border-radius: 18px; text-align: right;
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(6px);
  }
  .label { font-size: 13px; color: var(--muted); margin: 0 4px 8px; }
  .seg { display: flex; gap: 6px; background: rgba(0,0,0,.35); padding: 4px; border-radius: 14px; }
  .seg button {
    flex: 1; font: inherit; font-size: 14px; padding: 9px 4px; border-radius: 11px; border: 0; cursor: pointer;
    background: transparent; color: var(--fg); transition: background .2s, color .2s;
  }
  .seg button.on { background: linear-gradient(180deg, #ffd75a, #ffb81f); color: #241a00; font-weight: 700; box-shadow: 0 2px 10px rgba(255,190,40,.35); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button {
    font: inherit; font-size: 13px; color: var(--fg); cursor: pointer; padding: 10px 4px 8px; border-radius: 14px;
    background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform .15s, border-color .2s, background .2s;
  }
  .grid button span { font-size: 28px; line-height: 1.1; }
  .grid button.on { border-color: var(--accent); background: rgba(255,207,63,.12); color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255,207,63,.18); }
  .home button.big { width: 100%; max-width: 420px; font-size: 22px; padding: 15px; margin-top: 4px; background: linear-gradient(180deg, #ffd75a, #ffb81f); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 4px 18px rgba(255,190,40,.35) } 50% { box-shadow: 0 4px 30px rgba(255,190,40,.65) } }
  #helpScreen { z-index: 20; background: rgba(5,6,9,.85); backdrop-filter: blur(6px); }
  .helpBox { max-width: 440px; width: 100%; background: #14171e; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 18px 18px 14px; text-align: right; }
  .helpBox h2 { margin: 0 0 6px; color: var(--accent); font-size: 22px; }
  .helpBox p { font-size: 14px; line-height: 1.9; margin: 8px 0; }
  .helpBox button.big { width: 100%; margin-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="fallbackBg"></div>

<div id="overlay">
  <canvas id="gl3d"></canvas>
  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="hud" class="hidden">
    <div class="stat">امتیاز: <b id="score">۰</b><br>مرحله: <span id="level">۱</span></div>
    <button id="exitBtn">خروج</button>
    <div class="stat" style="text-align:left"><span id="leftLabel">پشه‌های مونده</span>: <b id="left">۰</b><div id="healthWrap"><div id="health"></div></div><div id="timer" class="hidden"></div></div>
  </div>
  <div id="banner"></div>
  <div id="power" class="hidden"></div>
  <div id="hint"></div>
</div>

<div id="startScreen" class="screen home">
  <div class="homeTop">
    <button id="helpBtn" class="iconBtn" aria-label="راهنما">?</button>
    <div class="best" id="best"></div>
  </div>
  <div class="logo">
    <img src="icons/icon-192.png" alt="" class="logoImg">
    <h1>وزوز</h1>
    <div class="tag">شکار در دنیای واقعی</div>
  </div>

  <div class="card">
    <div class="label">حالت بازی</div>
    <div class="seg" id="modes">
      <button data-m="free" class="on">🕊️ پرواز آزاد</button>
      <button data-m="attack">⚔️ حمله به کاربر</button>
    </div>
  </div>

  <div class="card">
    <div class="label" id="whatQ">با چی بازی کنی؟</div>
    <div class="grid" id="themes">
      <button data-t="plane" class="on"><span>✈️</span>هواپیما</button>
      <button data-t="shark"><span>🦈</span>کوسه</button>
      <button data-t="bird"><span>🐦</span>پرنده</button>
      <button data-t="missile"><span>🚀</span>موشک</button>
      <button data-t="star"><span>⭐</span>ستاره</button>
      <button data-t="mosquito"><span>🦟</span>پشه</button>
    </div>
  </div>

  <div class="card">
    <div class="label">کجا بازی می‌کنی؟</div>
    <div class="seg" id="sizes">
      <button data-r="3">اتاق</button>
      <button data-r="6" class="on">خونه</button>
      <button data-r="12">فضای باز</button>
    </div>
  </div>

  <button class="big" id="startBtn">شروع</button>
</div>

<div id="helpScreen" class="screen hidden">
  <div class="helpBox">
    <h2>راهنما</h2>
    <p id="intro"></p>
    <p id="modeDesc"></p>
    <p id="intro2"></p>
    <p>اگه درست وسط هدف بزنی «عالی!» میاد و امتیازش دو برابر می‌شه. هر مرحله یه جعبه‌ی جایزه‌ی سبز یه جایی ظاهر می‌شه، پیداش کن و بزن روش. هر سه مرحله یه غول آخر میاد.</p>
    <p class="small" id="modeNote"></p>
    <button class="big" id="helpClose">فهمیدم</button>
  </div>
</div>

<div id="overScreen" class="screen hidden">
  <h1 id="overTitle">نیش خوردی!</h1>
  <p id="overText"></p>
  <button class="big" id="againBtn">دوباره</button>
</div>

<script type="module">
import * as THREE from './lib/three.module.min.js';

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const video = $('cam'), canvas = $('game'), ctx = canvas.getContext('2d');
const flashEl = $('flash'), bannerEl = $('banner'), hintEl = $('hint'), overlayEl = $('overlay');
const fa = n => Math.round(n).toLocaleString('fa-IR');
const rand = (a, b) => a + Math.random() * (b - a);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
let W = 0, H = 0, DPR = 1, focal = 1, fovDeg = 62;

// ---------- 3D renderer (transparent, drawn over the camera feed) ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('gl3d'), alpha: true, antialias: true });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.03, 100);
scene.add(new THREE.HemisphereLight(0xeef4ff, 0x6a5a48, 2.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(1, 3, 2); scene.add(sun);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fovDeg = W > H ? 48 : 62;
  focal = (H / 2) / Math.tan(fovDeg * Math.PI / 360);
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.fov = fovDeg; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- Player pose ----------
// World: Y up, metres. camPos.y = camera height above the floor.
const camPos = V(0, 1.4, 0);
const camQ = new THREE.Quaternion();
let projM = null;
let mode = 'sensor';
let hasSensor = false, lastOrient = null;
let lookYaw = 0, lookPitch = 0;
const Q_TILT = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
const _e = new THREE.Euler(), _q = new THREE.Quaternion(), ZAXIS = V(0, 0, 1);

function screenAngle() {
  const o = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  return (o || 0) * Math.PI / 180;
}
function onOrient(e) { if (e.alpha == null && e.beta == null) return; hasSensor = true; lastOrient = e; }
function updateSensorPose() {
  if (hasSensor && lastOrient) {
    const d = Math.PI / 180;
    _e.set((lastOrient.beta || 0) * d, (lastOrient.alpha || 0) * d, -(lastOrient.gamma || 0) * d, 'YXZ');
    camQ.setFromEuler(_e).multiply(Q_TILT).multiply(_q.setFromAxisAngle(ZAXIS, -screenAngle()));
  } else {
    _e.set(lookPitch, lookYaw, 0, 'YXZ'); camQ.setFromEuler(_e);
  }
}
function forwardFlat() {
  const f = V(0, 0, -1).applyQuaternion(camQ);
  let fx = f.x, fz = f.z;
  if (Math.hypot(fx, fz) < 0.2) { const u = V(0, 1, 0).applyQuaternion(camQ); const s = Math.sign(-f.y || 1); fx = u.x * s; fz = u.z * s; }
  const l = Math.hypot(fx, fz) || 1;
  return [fx / l, fz / l];
}

// Step counting fallback (no WebXR)
let accLP = 9.8, lastStep = 0, stepArmed = true, steps = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  accLP = accLP * 0.8 + Math.hypot(a.x, a.y, a.z) * 0.2;
  const now = performance.now();
  if (stepArmed && accLP > 11.2 && now - lastStep > 320) { stepArmed = false; lastStep = now; takeStep(); }
  if (accLP < 10.2) stepArmed = true;
}
function takeStep() {
  if (mode !== 'sensor' || state !== 'play') return;
  const [fx, fz] = forwardFlat();
  camPos.x += fx * 0.65; camPos.z += fz * 0.65; steps++;
}
async function enableSensors() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') await DeviceOrientationEvent.requestPermission();
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') await DeviceMotionEvent.requestPermission();
  } catch (_) {}
  window.addEventListener('deviceorientation', onOrient, true);
  window.addEventListener('devicemotion', onMotion, true);
}

// Desktop: drag to look, WASD to walk
let dragging = false, dragX = 0, dragY = 0, dragMoved = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; dragX = e.clientX; dragY = e.clientY; dragMoved = 0; });
window.addEventListener('pointermove', e => {
  if (!dragging || hasSensor || mode === 'xr') return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  lookYaw += dx * 0.005; lookPitch = Math.max(-1.45, Math.min(1.45, lookPitch + dy * 0.005));
  dragX = e.clientX; dragY = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; });
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

async function startCamera() {
  if (video.srcObject) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play().catch(() => {});
  } catch (err) { video.classList.add('hidden'); $('fallbackBg').style.display = 'block'; }
}

// ---------- WebXR (Android Chrome + ARCore: real walking tracking) ----------
let xrSession = null, xrRef = null, xrGL = null, xrFloor = false, xrLastT = 0;
async function xrSupported() { try { return !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch (_) { return false; } }
async function startXR() {
  const session = await navigator.xr.requestSession('immersive-ar', { optionalFeatures: ['dom-overlay', 'local-floor'], domOverlay: { root: overlayEl } });
  const glc = document.createElement('canvas');
  xrGL = glc.getContext('webgl', { xrCompatible: true, alpha: true });
  await session.updateRenderState({ baseLayer: new XRWebGLLayer(session, xrGL) });
  try { xrRef = await session.requestReferenceSpace('local-floor'); xrFloor = true; }
  catch (_) { xrRef = await session.requestReferenceSpace('local'); xrFloor = false; }
  xrSession = session; mode = 'xr';
  document.body.classList.add('xr'); video.classList.add('hidden');
  session.addEventListener('end', () => {
    xrSession = null; mode = 'sensor'; projM = null;
    document.body.classList.remove('xr'); video.classList.remove('hidden');
    camera.fov = fovDeg; camera.updateProjectionMatrix();
    if (state === 'play') gameOver(true);
    requestAnimationFrame(loop);
  });
  session.requestAnimationFrame(onXRFrame);
}
function onXRFrame(t, frame) {
  const session = frame.session;
  session.requestAnimationFrame(onXRFrame);
  xrGL.bindFramebuffer(xrGL.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
  xrGL.clearColor(0, 0, 0, 0); xrGL.clear(xrGL.COLOR_BUFFER_BIT);
  const pose = frame.getViewerPose(xrRef);
  if (pose) {
    const p = pose.transform.position, o = pose.transform.orientation;
    camPos.set(p.x, xrFloor ? p.y : p.y + 1.4, p.z);
    camQ.set(o.x, o.y, o.z, o.w);
    projM = pose.views[0].projectionMatrix;
  }
  const dt = Math.min(0.05, (t - xrLastT) / 1000 || 0); xrLastT = t;
  step(dt);
}

// ---------- Audio ----------
let actx = null, master = null, noiseBuf = null;
function initAudio() {
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { actx = null; }
}
const setP = (param, v, tc = 0.05) => param.setTargetAtTime(v, actx.currentTime, tc);
function updateListener() {
  if (!actx) return;
  const L = actx.listener, f = V(0, 0, -1).applyQuaternion(camQ), u = V(0, 1, 0).applyQuaternion(camQ);
  if (L.forwardX) {
    setP(L.forwardX, f.x, 0.02); setP(L.forwardY, f.y, 0.02); setP(L.forwardZ, f.z, 0.02);
    setP(L.upX, u.x, 0.02); setP(L.upY, u.y, 0.02); setP(L.upZ, u.z, 0.02);
    setP(L.positionX, camPos.x, 0.02); setP(L.positionY, camPos.y, 0.02); setP(L.positionZ, camPos.z, 0.02);
  } else {
    L.setOrientation && L.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z);
    L.setPosition && L.setPosition(camPos.x, camPos.y, camPos.z);
  }
}
function makeVoice(basePitch, vol) {
  if (!actx) return null;
  const S = theme.sound, pitch = basePitch * S.f;
  const out = actx.createGain(); out.gain.value = 0;
  const pan = actx.createPanner();
  pan.panningModel = 'HRTF'; pan.distanceModel = 'inverse'; pan.refDistance = 0.6; pan.rolloffFactor = 1.2; pan.maxDistance = 40;
  out.connect(pan); pan.connect(master);
  const nodes = [];
  const osc = actx.createOscillator(); osc.type = S.wave; osc.frequency.value = pitch;
  const lfo = actx.createOscillator(); lfo.frequency.value = S.lfo * rand(0.85, 1.15);
  const lg = actx.createGain(); lg.gain.value = pitch * S.depth; lfo.connect(lg); lg.connect(osc.frequency);
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = pitch * 2.2; bp.Q.value = 1.1;

function sfx(type, arg) {
  if (!actx) return;
  const t = actx.currentTime;
  const tone = (f0, f1, dur, vol, wave) => {
    const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(master);
    o.type = wave; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.8);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.start(t); o.stop(t + dur + 0.01);
  };
  const noise = (dur, vol, f0, f1) => {
    if (!noiseBuf) return;
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
  };

  else if (type === 'hit') tone(700, 300, 0.08, 0.2, 'square');
  else if (type === 'bite') tone(140, 70, 0.35, 0.5, 'sawtooth');
  else if (type === 'alert') tone(500, 900, 0.18, 0.15, 'sine');
  else if (type === 'level') tone(440, 880, 0.4, 0.25, 'sine');
  else if (type === 'boom') { noise(0.9, 0.9, 2500, 80); tone(90, 30, 0.6, 0.6, 'sine'); }
  else if (type === 'launch') noise(0.6, 0.35, 600, 4000);
  else if (type === 'flap') noise(0.25, 0.25, 1500, 300);
  else if (type === 'chime') { tone(1320, 1320, 0.5, 0.18, 'sine'); setTimeout(() => sfx('chime2'), 90); }
  else if (type === 'chime2') tone(1980, 1980, 0.6, 0.14, 'sine');
  else if (type === 'perfect') { tone(880, 1760, 0.25, 0.25, 'triangle'); tone(1320, 2640, 0.3, 0.12, 'sine'); }
  else if (type === 'power') { tone(660, 660, 0.15, 0.2, 'sine'); setTimeout(() => sfx('chime2'), 120); }
  else if (type === 'shieldHit') tone(300, 900, 0.25, 0.25, 'sine');
  else if (type === 'bossIn') { tone(110, 55, 1.2, 0.5, 'sawtooth'); noise(1.0, 0.4, 400, 80); }
  else if (type === 'splash') { noise(0.8, 0.6, 900, 120); tone(220, 90, 0.4, 0.3, 'sine'); }
  else if (type === 'beep') tone(1700, 1700, 0.07, Math.max(0.04, 0.22 - (arg || 0) * 0.04), 'square');
}

function buildBird(color, ghost) {

function buildStar(color, ghost) {
  const root = new THREE.Group(), mats = [];
  const gold = stdMat(color, { metalness: 0.3, roughness: 0.3, emissive: color, emissiveIntensity: 0.55 }); mats.push(gold);
  const g = geo('star', () => {
    const s = new THREE.Shape();

  });

// smoke puffs for missiles and falling planes
const puffs = [];
const puffGeo = new THREE.SphereGeometry(1, 8, 6);

  const m = new THREE.Mesh(puffGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, depthWrite: false }));

// ---------- Game state ----------
let state = 'menu';
let areaR = 6;
let origin = V();
let mosquitoes = [], wrecks = [], particles = [], popups = [];
let score = 0, health = 100, level = 0, levelTime = 0, levelBreak = 0, levelLimit = 0;
let combo = 0, comboTimer = 0, biteTimes = [], itchUntil = 0, shake = 0;
let slowmoT = 0, power = null, crate = null, crateAt = 0, bossMinionT = 0;
let lastT = 0, time = 0, nextId = 1;
const MAX_VOICES = 7;

function levelPlan(n) {
  const count = gameMode === 'free' ? 3 + n : 4 + Math.floor(n * 1.5);
  const pool = [['normal', 1]];
  if (n >= 3) pool.push(['fast', 0.25 + 0.03 * n]);
  if (n >= 4) pool.push(['fat', 0.25]);
  if (n >= 5) pool.push(['splitter', 0.25]);
  if (n >= 7) pool.push(['ghost', 0.2]);
  return { count, pool, speedMul: 1 + Math.min(n - 1, 10) * 0.04, aggroMul: 1 + Math.min(n - 1, 10) * 0.03 };
}
function pick(pool) {
  const total = pool.reduce((s, p) => s + p[1], 0);
  let r = Math.random() * total;
  for (const [k, w] of pool) { r -= w; if (r <= 0) return k; }
  return pool[0][0];
}
// Gentle side-to-side manoeuvres only from level 3 on; level 1-2 come straight at you.
function weaveAmount() { return level <= 2 ? 0 : Math.min(0.6, (level - 2) * 0.1); }

function hidingSpot(minD, maxD) {
  const a = Math.random() * Math.PI * 2, d = rand(minD, maxD);
  let y;
  if (themeKey === 'plane' || themeKey === 'bird' || themeKey === 'star') y = rand(1.3, 2.3);
  else if (themeKey === 'shark') y = rand(0.6, 2.1);
  else y = Math.random() < 0.25 ? rand(0.25, 0.5) : (Math.random() < 0.3 ? rand(1.9, 2.4) : rand(0.6, 1.8));
  return V(origin.x + Math.cos(a) * d, y, origin.z + Math.sin(a) * d);
}

function spawn(typeKey, pos, plan) {
  const T = TYPES[typeKey];
  const color = PALETTE[themeKey][typeKey];
  const build = { plane: buildPlane, missile: buildMissile, bird: buildBird, mosquito: buildMosquito, star: buildStar, shark: buildShark }[themeKey];
  const model = build(color, !!T.ghost);
  const baseScale = themeKey === 'missile' ? (T.boss ? 0.9 : 1.6) : 1;
  model.root.scale.setScalar(T.scale * baseScale);
  if (T.ghost) model.mats.forEach(m => { m.transparent = true; m.opacity = 0.25; });
  scene.add(model.root);
  const heading = V(rand(-1, 1), 0, rand(-1, 1)).normalize();
  const m = {
    id: nextId++, type: typeKey, T, hp: T.hp, pos: pos.clone(), home: pos.clone(), heading, speed: 0,
    phase: Math.random() * 100, mode: 'rest', cool: 0, roll: 0, prevYaw: Math.atan2(heading.x, heading.z),
    orbitDir: Math.random() < 0.5 ? 1 : -1,
    speedMul: (plan ? plan.speedMul : 1) * rand(0.92, 1.08), aggro: T.aggro * theme.aggro * (plan ? plan.aggroMul : 1),
    hitFlash: 0, voice: null, screen: null, model, puffT: 0
  };
  if (T.boss) { m.hp = m.maxHp = 10 + level * 2; m.mode = 'cruise'; m.diveCool = 6; }
  if (themeKey === 'missile') m.heading.copy(camPos).sub(m.pos).normalize();
  mosquitoes.push(m);
  return m;
}
function removeModel(model) {
  scene.remove(model.root);
  model.mats.forEach(m => m.dispose());
}

function startLevel() {
  level++; levelTime = 0;
  origin.set(camPos.x, 0, camPos.z);
  const plan = levelPlan(level);
  const bossLevel = level % 3 === 0;
  if (bossLevel) plan.count = Math.ceil(plan.count / 2);
  for (let i = 0; i < plan.count; i++) {
    const frac = i / plan.count;
    const minD = i < 2 ? 1.8 : Math.max(1.8, areaR * 0.3);
    const maxD = i < 2 ? Math.min(2.8, Math.max(2, areaR)) : areaR * (0.6 + 0.4 * frac);
    const m = spawn(pick(plan.pool), hidingSpot(minD, Math.max(minD + 0.5, maxD)), plan);
    if (FREE()) { m.mode = 'cruise'; m.speed = 0.2; }
  }
  levelLimit = FREE() ? 40 + plan.count * 8 + (bossLevel ? 40 : 0) : 0;
  if (bossLevel) {
    const [fx, fz] = forwardFlat(), a = Math.atan2(fz, fx) + rand(-0.8, 0.8);
    const b = spawn('boss', V(camPos.x + Math.cos(a) * 4, 1.7, camPos.z + Math.sin(a) * 4), plan);
    b.heading.set(-Math.sin(a), 0, Math.cos(a)); b.speed = 0.4; bossMinionT = 5;
  }
  crateAt = rand(10, 20);
  $('level').textContent = fa(level);
  updateLeft();
  if (bossLevel) { showBanner('غول آخر!', 'یه ' + theme.one + (theme.one.endsWith('ه') ? '‌ی' : 'ی') + ' غول‌پیکر اومده سراغت', 2600); sfx('bossIn'); }
  else showBanner('مرحله‌ی ' + fa(level), fa(plan.count) + ' تا ' + theme.one + ' این اطراف قایم شدن', 2200);
  sfx('level');
}
function updateLeft() { $('left').textContent = fa(mosquitoes.length); }
function showBanner(text, sub = '', ms = 1600) {
  bannerEl.innerHTML = text + (sub ? '<small>' + sub + '</small>' : '');
  bannerEl.style.opacity = 1;
  clearTimeout(showBanner._t); showBanner._t = setTimeout(() => bannerEl.style.opacity = 0, ms);
}
function clearWorld() {
  mosquitoes.forEach(m => { stopVoice(m.voice); removeModel(m.model); });
  wrecks.forEach(w => removeModel(w.model));
  puffs.forEach(p => { scene.remove(p.m); p.m.material.dispose(); });
  mosquitoes = []; wrecks = []; puffs.length = 0; particles = []; popups = [];
  removeCrate(); endPower(true); slowmoT = 0;
}
function resetGame() {
  clearWorld();
  score = 0; health = 100; level = 0; combo = 0; biteTimes = []; itchUntil = 0; steps = 0; levelBreak = 0;
  $('score').textContent = fa(0); $('health').style.width = '100%';
  $('healthWrap').classList.toggle('hidden', FREE()); $('timer').classList.toggle('hidden', !FREE());
  startLevel();
}

function hurt(m) {
  if (power && power.kind === 'shield') {
    sfx('shieldHit');
    particles.push({ ring: true, x: W / 2, y: H / 2, life: 0.4, r: 40, c: 'rgba(120,220,255,.9)' });
    return;
  }
  health = Math.max(0, health - m.T.dmg);
  $('health').style.width = health + '%';
  flashEl.style.transition = 'none'; flashEl.style.opacity = 1;
  requestAnimationFrame(() => { flashEl.style.transition = 'opacity .6s'; flashEl.style.opacity = 0; });
  try { navigator.vibrate && navigator.vibrate(themeKey !== 'star' && (theme.impact === 'explode' || theme.impact === 'pass') ? [250, 60, 120] : [120, 40, 80]); } catch (_) {}
  combo = 0;
  biteTimes = biteTimes.filter(t => time - t < 6); biteTimes.push(time);
  if (biteTimes.length >= 3) { itchUntil = time + 3; biteTimes = []; showBanner(themeKey === 'mosquito' ? 'خارش!' : 'گیج شدی!', '', 1200); }
}

function impact(m) {
  hurt(m);
  if (theme.impact === 'explode') {
    // the missile blows up on you (or the star bursts) and is gone
    if (themeKey === 'star') { sfx('chime'); sparkleAt(W / 2, H / 2, 50); shake = 0.2; }
    else { sfx('boom'); shake = 0.5; explosionAt(W / 2, H / 2, 40); }
    m.dead = true; stopVoice(m.voice); m.voice = null; removeModel(m.model);
  } else {
    sfx(theme.impact === 'pass' ? 'boom' : 'bite');
    if (theme.impact === 'pass') shake = 0.35;
    // fly on past the player, then come round later from a new spot
    const ahead = m.heading.clone(); ahead.y = 0; if (ahead.lengthSq() < 0.01) ahead.set(1, 0, 0); ahead.normalize();
    const d = rand(2.5, Math.max(3, areaR * 0.7));
    m.home.set(camPos.x + ahead.x * d + rand(-1, 1), themeKey === 'mosquito' ? rand(0.5, 2.2) : rand(1.4, 2.3), camPos.z + ahead.z * d + rand(-1, 1));
    m.mode = 'flee'; m.cool = 6;
  }
  if (health <= 0) gameOver(false);
}

function explosionAt(sx, sy, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 260;
    particles.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, r: 3 + Math.random() * 6,
      c: ['#fff3b0', '#ffcf3f', '#ff8a1f', '#ff3b1f', '#555', '#333'][Math.floor(Math.random() * 6)] });
  }
  particles.push({ ring: true, x: sx, y: sy, life: 0.4, r: 8, c: 'rgba(255,170,40,.9)' });
}

function sparkleAt(sx, sy, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
    particles.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.5, r: 1.5 + Math.random() * 3.5,
      c: ['#fff6c8', '#ffe066', '#ffc83a', '#ffffff'][Math.floor(Math.random() * 4)] });
  }
  particles.push({ ring: true, x: sx, y: sy, life: 0.4, r: 8, c: 'rgba(255,220,90,.9)' });
}

function kill(m, sx, sy, perfect) {
  stopVoice(m.voice); m.voice = null; m.dead = true;
  combo++; comboTimer = 4;
  const pts = Math.round(m.T.score * (1 + Math.floor(combo / 3) * 0.5) * (perfect ? 2 : 1));
  if (m.T.boss) { explosionAt(sx, sy, 60); shake = 0.6; sfx('boom'); showBanner('غول رو زدی!', '+' + fa(pts), 2200); }
  score += pts; $('score').textContent = fa(score);
  popups.push({ x: sx, y: sy, text: '+' + fa(pts), life: 0.9 });
  if (themeKey === 'missile') { removeModel(m.model); explosionAt(sx, sy, 28); sfx('boom'); }
  else if (themeKey === 'star') { removeModel(m.model); sparkleAt(sx, sy, 30); sfx('chime'); }
  else if (themeKey === 'mosquito') {
    removeModel(m.model);
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 150;
      particles.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, r: 2 + Math.random() * 3, c: Math.random() < 0.4 ? '#b3121b' : '#1a1714' });
    }
    sfx('splat');
  } else {
    // planes and birds fall out of the sky instead of vanishing
    const vel = m.heading.clone().multiplyScalar(m.speed * 0.6);
    wrecks.push({ model: m.model, pos: m.pos.clone(), vel, spin: (themeKey === 'shark' ? 1.4 : rand(2, 5)) * (Math.random() < 0.5 ? 1 : -1), life: themeKey === 'shark' ? 3 : 2.2, q: m.model.root.quaternion.clone() });
    if (themeKey === 'plane') { explosionAt(sx, sy, 14); sfx('boom'); }
    else if (themeKey === 'shark') {
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 90, bub = Math.random() < 0.4;
        particles.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (bub ? 40 : 0), life: 1.2 + Math.random() * 0.6,
          r: bub ? 2 + Math.random() * 3 : 6 + Math.random() * 10, c: bub ? 'rgba(220,245,255,.8)' : 'rgba(150,10,20,.45)', bubble: bub });
      }
      sfx('splash');
    }
    else {
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 110;
        particles.push({ feather: true, x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1 + Math.random() * 0.4, r: 2 + Math.random() * 2.5, c: Math.random() < 0.5 ? '#eee6d6' : '#' + PALETTE.bird[m.type].toString(16).padStart(6, '0') });
      }
      sfx('flap');
    }
  }
  if (m.T.split) {
    for (let i = 0; i < 2; i++) {
      const c = spawn('mini', m.pos.clone().add(V(rand(-0.2, 0.2), rand(-0.1, 0.1), rand(-0.2, 0.2))));
      c.home = hidingSpot(1.8, Math.max(2.5, areaR * 0.5)); c.mode = FREE() ? 'cruise' : 'flee'; c.cool = 3;
      c.heading.copy(c.pos).sub(camPos).normalize(); c.speed = 0.6;
    }
  }
  try { navigator.vibrate && navigator.vibrate(20); } catch (_) {}
}

function gameOver(quit, timeUp) {
  if (state !== 'play') return;
  state = 'over';
  mosquitoes.forEach(m => { stopVoice(m.voice); m.voice = null; });
  let best = 0;
  try { best = +localStorage.getItem('vizviz_best') || 0; if (score > best) localStorage.setItem('vizviz_best', score); } catch (_) {}
  $('overTitle').textContent = quit ? 'بازی تموم شد' : timeUp ? 'وقت تموم شد!' : theme.hitTitle;
  $('overText').innerHTML = 'به مرحله‌ی ' + fa(level) + ' رسیدی.<br>امتیاز: <b>' + fa(score) + '</b>' +
    (score > best ? '<br>رکورد جدید!' : (best ? '<br>بهترین امتیاز: ' + fa(best) : ''));
  $('overScreen').classList.remove('hidden');
  $('hud').classList.add('hidden');
  hintEl.textContent = '';
  if (xrSession) xrSession.end().catch(() => {});
}

// ---------- Input ----------
canvas.addEventListener('pointerup', e => {
  if (state !== 'play') return;
  if (mode !== 'xr' && !hasSensor && dragMoved > 12) return;
  swat(e.clientX, e.clientY);
});
overlayEl.addEventListener('beforexrselect', e => e.preventDefault());

function swat(x, y) {
  const big = power && power.kind === 'big';
  particles.push({ ring: true, x, y, life: 0.25, r: big ? 30 : 10, c: big ? 'rgba(120,255,200,.9)' : null });
  // the bonus crate opens with a tap
  if (crate && crate.screen && Math.hypot(crate.screen.x - x, crate.screen.y - y) < Math.max(44, crate.screen.r * 1.6)) { openCrate(); return; }
  let best = null, bestD = Infinity, bestDist = 0;
  for (const m of mosquitoes) {
    if (m.dead || !m.screen) continue;
    const s = m.screen, radius = Math.max(38, s.r * 1.4) * (big ? 2.5 : 1), d = Math.hypot(s.x - x, s.y - y);
    if (d < radius && s.depth < bestD) { best = m; bestD = s.depth; bestDist = d; }
  }
  if (!best) return;
  // a hit right on the centre counts as perfect: double points and a moment of slow motion
  const perfect = bestDist < Math.max(10, best.screen.r * 0.3);
  if (perfect) {
    slowmoT = 0.7; sfx('perfect');
    popups.push({ x: best.screen.x, y: best.screen.y - 30, text: 'عالی!', life: 1.1, big: true });
  }
  best.hp -= big ? (best.T.boss ? 3 : best.hp) : (perfect && best.T.boss ? 2 : 1);
  if (best.hp <= 0) kill(best, best.screen.x, best.screen.y, perfect);
  else {
    best.hitFlash = 0.15; sfx('hit');
    if (!best.T.boss) {
      best.pos.addScaledVector(best.pos.clone().sub(camPos).normalize(), 0.5);
      best.speed *= 0.4;
    }
  }
}

// ---------- Bonus crate ----------
function buildCrate() {
  const root = new THREE.Group(), mats = [];
  const wood = stdMat(0xc8862a, { roughness: 0.7, emissive: 0x3a2000, emissiveIntensity: 0.6 }); mats.push(wood);
  const band = stdMat(0x7affc8, { roughness: 0.3, emissive: 0x2aff9a, emissiveIntensity: 0.8 }); mats.push(band);
  root.add(mesh(geo('cr', () => new THREE.BoxGeometry(0.16, 0.16, 0.16)), wood));
  for (const r of [[0, 0, 0], [0, Math.PI / 2, 0], [Math.PI / 2, 0, 0]]) {
    const b = mesh(geo('crb', () => new THREE.BoxGeometry(0.168, 0.03, 0.168)), band); b.rotation.set(...r); root.add(b);
  }
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: 0x50ffb0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: false }));
  halo.scale.set(0.09, 0.09, 1); root.add(halo);
  return { root, mats, halo };
}
function spawnCrate() {
  const pos = hidingSpot(Math.min(2, areaR * 0.5), Math.max(2.5, areaR * 0.8)); pos.y = rand(0.7, 1.6);
  const model = buildCrate(); scene.add(model.root);
  crate = { model, pos, life: 30, screen: null };
  showBanner('جعبه‌ی جایزه!', 'یه جعبه‌ی درخشان یه جایی این اطراف ظاهر شد. پیداش کن و بزن روش.', 2600);
  sfx('power');
}
function removeCrate() { if (crate) { removeModel(crate.model); crate = null; } }
function openCrate() {
  const sx = crate.screen.x, sy = crate.screen.y;
  removeCrate(); sparkleAt(sx, sy, 40); sfx('power');
  const kinds = ['bomb', 'slow', 'shield', 'big'];
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  if (kind === 'bomb') {
    showBanner('بمب!', 'هر چی دور و برت بود نابود شد', 1800);
    shake = 0.5; explosionAt(W / 2, H / 2, 50); sfx('boom');
    for (const m of mosquitoes.slice()) {
      if (m.dead || !(m.screen || m.pos.distanceTo(camPos) < 3)) continue;
      const p = m.screen || { x: W / 2, y: H / 2 };
      if (m.T.boss) { m.hp -= 5; m.hitFlash = 0.3; if (m.hp <= 0) kill(m, p.x, p.y); }
      else kill(m, p.x, p.y);
    }
  } else if (kind === 'slow') startPower('slow', 8, 'زمان کند شد!');
  else if (kind === 'shield') {
    if (FREE()) { levelLimit += 15; showBanner('۱۵ ثانیه زمان اضافه!', '', 1800); }
    else startPower('shield', 10, 'سپر!');
  } else startPower('big', 12, 'ضربه‌ی بزرگ!');
}
const POWER_LABEL = { slow: '⏳ زمان کند', shield: '🛡️ سپر', big: '💥 ضربه‌ی بزرگ' };
function startPower(kind, t, title) {
  power = { kind, t, max: t };
  showBanner(title, '', 1500);
  $('power').classList.remove('hidden');
}
function endPower(silent) {
  power = null;
  const el = document.getElementById('power'); if (el) el.classList.add('hidden');
}
function updateCrate(dt, rdt) {
  if (!crate) {
    if (levelTime > crateAt && crateAt > 0 && mosquitoes.length) { crateAt = 0; spawnCrate(); }
    return;
  }
  crate.life -= rdt;
  if (crate.life <= 0) { removeCrate(); return; }
  const r = crate.model.root;
  r.position.copy(crate.pos); r.position.y += Math.sin(time * 2) * 0.05;
  r.rotation.y += dt * 1.2; r.rotation.x = 0.35;
  r.visible = crate.life > 6 || Math.sin(time * 14) > 0;
  crate.model.halo.material.opacity = 0.6 + 0.4 * Math.sin(time * 5);
}

// ---------- Movement ----------
const _d = V(), _t = V(), _s = V();
// turn the heading towards `desired` at no more than `rate` rad/s
function turnToward(h, desired, rate, dt) {
  const ang = h.angleTo(desired);
  if (ang < 1e-4) return;
  if (ang > 3.0) desired = desired.clone().add(V(-h.z, 0, h.x).multiplyScalar(0.2)).normalize();
  h.lerp(desired, Math.min(1, rate * dt / ang)).normalize();
}

function moveEntity(m, dt) {
  const toP = _d.copy(camPos).sub(m.pos), dP = toP.length();
  const T = m.T;
  const wv = weaveAmount() + (T.agile && level >= 3 ? 0.15 : 0);

  if (m.mode === 'rest' && dP < m.aggro && m.cool <= 0) {
    m.mode = 'attack'; m.attackT = 0;
    sfx(themeKey === 'missile' ? 'launch' : 'alert');
  }
  if (m.mode === 'attack' && dP > m.aggro * 2.6 && themeKey !== 'missile' && themeKey !== 'star') { m.mode = 'rest'; m.cool = 2; }
  if (m.mode === 'flee' && m.cool <= 0) m.mode = 'rest';

  let attackSpeed = T.speed * theme.speed * m.speedMul;
  if (themeKey === 'star') attackSpeed *= Math.min(2.2, 0.55 + 0.15 * (level - 1));

  if (m.mode === 'attack') {
    m.attackT += dt;
    const desired = toP.clone().normalize();
    if (wv > 0) {
      const lat = _s.crossVectors(desired, UP).normalize();
      desired.addScaledVector(lat, Math.sin(m.attackT * 1.1 + m.id) * wv).normalize();
    }
    if (themeKey === 'mosquito') {
      desired.add(_t.set(Math.sin(time * 3.1 + m.id), Math.sin(time * 4.3 + m.id * 2) * 0.6, Math.cos(time * 2.7 + m.id)).multiplyScalar(0.25)).normalize();
      turnToward(m.heading, desired, theme.turn, dt);
      m.speed += (attackSpeed - m.speed) * Math.min(1, dt * 3);
    } else if (themeKey === 'star') {
      // drifts straight at you, slowly and steadily
      turnToward(m.heading, toP.clone().normalize(), theme.turn, dt);
      m.speed += (attackSpeed - m.speed) * Math.min(1, dt * 0.8);
    } else if (themeKey === 'missile') {
      // ignition: a short hesitation, then hard acceleration
      turnToward(m.heading, desired, m.attackT < 0.5 ? 3 : theme.turn, dt);
      const target = m.attackT < 0.4 ? 0.05 : attackSpeed * Math.min(1.3, 0.5 + m.attackT * 0.6);
      m.speed += (target - m.speed) * Math.min(1, dt * 2.5);
    } else {
      turnToward(m.heading, desired, theme.turn * (T.agile ? 1.3 : 1), dt);
      m.speed += (attackSpeed - m.speed) * Math.min(1, dt * 1.5);
    }
    m.pos.addScaledVector(m.heading, m.speed * dt);
    if (m.pos.distanceTo(camPos) < 0.3) { impact(m); return; }
  } else if (themeKey === 'plane' || themeKey === 'bird' || themeKey === 'shark') {
    // cruise: circle around the home spot (or fly to a new one), banking in the turns
    const rel = _t.copy(m.pos).sub(m.home); rel.y = 0;
    const R = theme.orbit, rl = rel.length() || 0.001;
    let desired;
    if (m.mode === 'flee' || rl > R * 2.2) desired = m.home.clone().sub(m.pos).normalize();
    else {
      desired = V(-rel.z * m.orbitDir, 0, rel.x * m.orbitDir).normalize();
      desired.addScaledVector(rel.normalize(), -(rl - R) * 1.5);
      desired.y = (m.home.y - m.pos.y) * 1.2;
      desired.normalize();
    }
    turnToward(m.heading, desired, theme.turn, dt);
    const cruise = m.mode === 'flee' ? attackSpeed : theme.cruise;
    m.speed += (cruise - m.speed) * Math.min(1, dt * 1.2);
    m.pos.addScaledVector(m.heading, m.speed * dt);
  } else if (themeKey === 'star') {
    m.pos.lerp(_t.copy(m.home).add(_s.set(Math.sin(m.phase * 0.5 + m.id) * 0.05, Math.sin(m.phase * 0.9) * 0.05, 0)), Math.min(1, dt * 1.2));
    m.speed = 0;
  } else if (themeKey === 'missile') {
    // hover at the spot, nose slowly tracking the player
    m.pos.lerp(_t.copy(m.home).add(_s.set(0, Math.sin(m.phase * 1.4) * 0.03, 0)), Math.min(1, dt * 1.5));
    turnToward(m.heading, toP.clone().normalize(), 0.6, dt);
    m.speed = 0;
  } else {
    // mosquito: erratic hovering around its spot
    const target = _t.set(
      m.home.x + Math.sin(m.phase * 0.7 + m.id) * 0.25,
      m.home.y + Math.sin(m.phase * 1.3 + m.id * 2) * 0.12,
      m.home.z + Math.cos(m.phase * 0.9 + m.id) * 0.25);
    const toH = target.sub(m.pos), dH = toH.length() || 1e-3;
    turnToward(m.heading, toH.clone().normalize(), theme.turn, dt);
    m.speed = m.mode === 'flee' ? 1.1 : Math.min(0.45, dH * 1.5);
    m.pos.addScaledVector(m.heading, m.speed * dt);
  }

  bankFromTurn(m, dt);
}

// Free flight: wander between random waypoints around the area, never attacking.
// Speed, turning and side-to-side manoeuvres grow with the level.
const FREE_SPEED = { mosquito: 0.35, bird: 0.55, plane: 0.7, missile: 0.8, star: 0.3, shark: 0.55 };
function moveFree(m, dt) {
  const T = m.T, lv = level - 1;
  const speed = FREE_SPEED[themeKey] * (1 + lv * 0.12) * (T.agile ? 1.3 : 1) * (T.hp > 1 ? 0.8 : 1);
  m.wpT = (m.wpT || 0) - dt;
  if (!m.wp || m.pos.distanceTo(m.wp) < 0.5 || m.wpT <= 0) { m.wp = hidingSpot(0.8, Math.max(2, areaR)); m.wpT = rand(5, 10); }
  const desired = m.wp.clone().sub(m.pos).normalize();
  // keep clear of the player's face
  const away = _t.copy(m.pos).sub(camPos), d = away.length();
  if (d < 0.9) desired.addScaledVector(away.normalize(), (0.9 - d) * 4);
  // manoeuvres: none on level 1, then gradually more
  const wv = (level <= 1 ? 0 : Math.min(0.9, lv * 0.12)) + (T.agile && level > 1 ? 0.15 : 0);
  if (wv > 0) {
    const lat = _s.crossVectors(desired, UP).normalize();
    desired.addScaledVector(lat, Math.sin(m.phase * (1 + lv * 0.08) + m.id) * wv);
    desired.y += Math.sin(m.phase * 0.8 + m.id * 3) * wv * 0.3;
  }
  if (themeKey === 'mosquito') desired.add(_s.set(Math.sin(time * 3.1 + m.id), Math.sin(time * 4.3 + m.id * 2) * 0.6, Math.cos(time * 2.7 + m.id)).multiplyScalar(0.3));
  // stay between floor and ceiling
  if (m.pos.y < 0.3) desired.y += 1; if (m.pos.y > 2.4) desired.y -= 1;
  desired.normalize();
  turnToward(m.heading, desired, theme.turn * (1 + lv * 0.08), dt);
  m.speed += (speed - m.speed) * Math.min(1, dt * 1.2);
  m.pos.addScaledVector(m.heading, m.speed * dt);
  bankFromTurn(m, dt);
}

// Boss: circles the player at a few metres with slow weaving, releases small ones,
// and in attack mode now and then dives at the player.
function moveBoss(m, dt) {
  const toP = _d.copy(camPos).sub(m.pos), dP = toP.length();
  const R = 2.8;
  let desired, speed = 0.55 * (1 + level * 0.04);
  m.diveCool -= dt;
  if (!FREE() && m.mode !== 'attack' && m.diveCool <= 0) { m.mode = 'attack'; m.diveT = 3; sfx('alert'); }
  if (m.mode === 'attack') {
    m.diveT -= dt;
    desired = toP.clone().normalize(); speed *= 2;
    if (dP < 0.6) { hurt(m); if (health <= 0) { gameOver(false); return; } m.diveT = 0; }
    if (m.diveT <= 0) { m.mode = 'cruise'; m.diveCool = rand(7, 11); }
  } else {
    const rel = _t.copy(m.pos).sub(camPos); rel.y = 0;
    const rl = rel.length() || 0.001;
    desired = V(-rel.z * m.orbitDir, 0, rel.x * m.orbitDir).normalize();
    desired.addScaledVector(rel.normalize(), -(rl - R) * 1.2);
    desired.y = (1.8 + Math.sin(m.phase * 0.5) * 0.4 - m.pos.y) * 1.2;
    const lat = _s.crossVectors(desired, UP).normalize();
    desired.addScaledVector(lat, Math.sin(m.phase * 0.9) * 0.3);
    desired.normalize();
  }
  turnToward(m.heading, desired, 1.3, dt);
  m.speed += (speed - m.speed) * Math.min(1, dt * 1.2);
  m.pos.addScaledVector(m.heading, m.speed * dt);
  // minions
  bossMinionT -= dt;
  if (bossMinionT <= 0) {
    bossMinionT = rand(6, 9);
    if (mosquitoes.filter(x => x.type === 'mini' && !x.dead).length < 3) {
      const c = spawn('mini', m.pos.clone());
      c.home = hidingSpot(1.8, Math.max(2.5, areaR * 0.6));
      c.mode = FREE() ? 'cruise' : 'flee'; c.cool = 1.5; c.speed = 0.6;
      c.heading.copy(m.heading).negate();
    }
  }
  bankFromTurn(m, dt);
}

function bankFromTurn(m, dt) {
  // banking from turn rate (planes and birds roll into turns)
  const yaw = Math.atan2(m.heading.x, m.heading.z);
  let dy = yaw - m.prevYaw; if (dy > Math.PI) dy -= 2 * Math.PI; if (dy < -Math.PI) dy += 2 * Math.PI;
  m.prevYaw = yaw;
  const targetRoll = Math.max(-1, Math.min(1, -(dy / Math.max(dt, 1e-3)) * theme.bank));
  m.roll += (targetRoll - m.roll) * Math.min(1, dt * 3);
}

function poseModel(m, dt) {
  const r = m.model.root;
  r.position.copy(m.pos);
  const P = m.model.parts;
  if (P.star) {
    const d = m.pos.distanceTo(camPos);
    m.grow = m.mode === 'attack' ? 1 + 1.5 * Math.max(0, 1 - d / m.aggro) : 1;
    r.scale.setScalar(m.T.scale * m.grow);
    r.lookAt(camPos);
    P.star.rotation.z += dt * (m.mode === 'attack' ? 1.6 : 0.5);
    P.star.rotation.y = Math.sin(time * 1.3 + m.id) * 0.35;
    const tw = 0.55 + 0.45 * Math.abs(Math.sin(time * 3.1 + m.id) * Math.sin(time * 4.7 + m.id * 2));
    P.halo.material.opacity = tw; P.halo.scale.setScalar(0.04 + 0.04 * tw);
    P.rays.material.opacity = tw; P.rays.material.rotation = time * 0.4 + m.id;
    P.glow.material.opacity = 0.35 + 0.35 * tw;
  } else {
    r.lookAt(_t.copy(m.pos).add(m.heading));
    if (m.roll) r.rotateZ(m.roll);
  }
  if (P.wings) {
    const attack = m.mode === 'attack' || m.mode === 'flee' || m.mode === 'cruise';
    const gliding = !attack && Math.sin(m.phase * 0.6 + m.id) < -0.2;
    const f = attack ? 13 : 8;
    m.flapT = (m.flapT || 0) + dt * (gliding ? 0 : f);
    const a = gliding ? 0.08 : Math.sin(m.flapT);
    const lag = gliding ? 0.05 : Math.sin(m.flapT - 0.9);
    for (const w of P.wings) { w.shoulder.rotation.z = (a * 0.75 + 0.1) * w.s; w.elbow.rotation.z = lag * 0.5; }
    P.eyeM.color.setHex(m.mode === 'attack' ? 0xff2020 : 0x111111);
  }
  if (P.tail) {
    const attack = m.mode === 'attack' || m.mode === 'flee';
    m.swimT = (m.swimT || 0) + dt * (attack ? 8 : 3.5);
    P.tail.rotation.y = Math.sin(m.swimT) * 0.4;
    P.caudal.rotation.y = Math.sin(m.swimT - 0.9) * 0.45;
    r.rotateY(-Math.sin(m.swimT) * 0.07);
    P.jaw.rotation.x = attack ? 0.35 + 0.12 * Math.sin(time * 9) : 0.04;
  }
  if (P.qwings) for (const w of P.qwings) w.p.rotation.z = (0.2 + Math.random() * 0.9) * w.s;
  if (P.beacon) {
    // slow blink while waiting, faster and faster as it closes in
    const d = m.pos.distanceTo(camPos);
    const rate = m.mode === 'attack' ? 3 + Math.max(0, 1 - d / m.aggro) * 9 : m.mode === 'cruise' ? 2 : 1.1;
    m.blinkT = (m.blinkT || 0) + dt * rate;
    const on = (m.blinkT % 1) < 0.35;
    P.beacon.visible = on;
    if (on && !m.blinkOn && d < m.aggro * 2 && m.mode !== 'cruise') beepQueue.push(d);
    m.blinkOn = on;
  }
  if (P.flame) {
    const on = (m.mode === 'attack' || m.mode === 'cruise') && m.speed > 0.1;
    P.flame.visible = on;
    if (on) { const k = 0.8 + Math.random() * 0.5; P.flame.scale.set(1, 1, k * Math.min(1.6, 0.5 + m.speed)); }
  }
  // hit flash / ghost visibility
  const flash = m.hitFlash > 0;
  for (const mat of m.model.mats) {
    if (mat.emissive) {
      if (mat.userData.baseEm == null) mat.userData.baseEm = mat.emissive.getHex();
      mat.emissive.setHex(flash ? 0xffffff : mat.userData.baseEm);
    }
    if (m.T.ghost) mat.opacity = m.pos.distanceTo(camPos) < 1.3 ? 0.9 : 0.18 + 0.08 * Math.sin(time * 5 + m.id);
  }
}

// ---------- Update ----------
let beepQueue = [];
function update(dt) {
  time += dt;
  if (mode === 'sensor') {
    if (!hasSensor) { if (keys.arrowleft) lookYaw += dt * 1.8; if (keys.arrowright) lookYaw -= dt * 1.8; }
    updateSensorPose();
    if (state === 'play') {
      const [fx, fz] = forwardFlat(), sp = 1.4 * dt;
      if (keys.w || keys.arrowup) { camPos.x += fx * sp; camPos.z += fz * sp; }
      if (keys.s || keys.arrowdown) { camPos.x -= fx * sp; camPos.z -= fz * sp; }
      if (keys.a) { camPos.x += fz * sp; camPos.z -= fx * sp; }
      if (keys.d) { camPos.x -= fz * sp; camPos.z += fx * sp; }
    }
  }
  updateListener();

  // real time vs world time: perfect hits and the slow-time bonus slow the world down
  const rdt = dt;
  if (slowmoT > 0) slowmoT -= rdt;
  if (power && state === 'play') {
    power.t -= rdt;
    $('power').textContent = POWER_LABEL[power.kind] + ' ' + fa(Math.ceil(power.t));
    if (power.t <= 0) endPower();
  }
  dt *= (slowmoT > 0 ? 0.3 : 1) * (power && power.kind === 'slow' ? 0.4 : 1);

  // wrecks and smoke keep animating even after game over
  for (const w of wrecks) {
    w.life -= dt; w.vel.y -= (themeKey === 'shark' ? 0.4 : 3.5) * dt; if (themeKey === 'shark') w.vel.multiplyScalar(1 - dt); w.pos.addScaledVector(w.vel, dt);
    const r = w.model.root; r.position.copy(w.pos);
    if (themeKey === 'shark') { if (Math.abs(w.turned = (w.turned || 0) + w.spin * dt) < Math.PI) r.rotateZ(w.spin * dt); }
    else { r.rotateZ(w.spin * dt); r.rotateX(0.8 * dt); }
    if (themeKey === 'plane' && Math.random() < 0.6) puff(w.pos, 0.03, 0x444444, 1.0);
    if (w.pos.y < 0.05 || w.life <= 0) {
      if (themeKey === 'plane') { puff(w.pos, 0.08, 0xff8a1f, 0.4); puff(w.pos, 0.12, 0x555555, 1.4); }
      removeModel(w.model); w.done = true;
    }
  }
  wrecks = wrecks.filter(w => !w.done);
  for (const p of puffs) {
    p.life -= dt; const k = 1 - p.life / p.max;
    p.m.scale.setScalar(p.size * (1 + k * 2.5)); p.m.material.opacity = 0.45 * (1 - k);
    if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); }
  }
  for (let i = puffs.length - 1; i >= 0; i--) if (puffs[i].life <= 0) puffs.splice(i, 1);

  if (state !== 'play') return;
  levelTime += rdt;
  updateCrate(dt, rdt);
  if (comboTimer > 0) { comboTimer -= rdt; if (comboTimer <= 0) combo = 0; }
  const blur = time < itchUntil ? 'blur(5px) saturate(1.4)' : '';
  video.style.filter = blur; $('fallbackBg').style.filter = blur;

  if (FREE() && mosquitoes.length) {
    const left = Math.max(0, levelLimit - levelTime);
    $('timer').textContent = 'زمان: ' + fa(Math.ceil(left));
    $('timer').style.color = left < 10 ? '#ff5050' : '';
    if (left <= 0) { gameOver(false, true); return; }
  }
  if (mosquitoes.length === 0 && wrecks.length === 0) {
    if (levelBreak <= 0) {
      levelBreak = 3;
      const bonus = FREE() ? Math.round(Math.max(0, levelLimit - levelTime) * 5) : Math.max(0, Math.round(200 - levelTime * 2));
      score += bonus; $('score').textContent = fa(score);
      health = Math.min(100, health + 30); $('health').style.width = health + '%';
      showBanner('همه رو زدی!', bonus ? 'جایزه‌ی سرعت: ' + fa(bonus) : '', 2500);
    }
    levelBreak -= rdt;
    if (levelBreak <= 0.0001) { levelBreak = 0; startLevel(); }
  }

  let attackers = 0;
  for (const m of mosquitoes) {
    if (m.dead) continue;
    m.phase += dt;
    if (m.hitFlash > 0) m.hitFlash -= dt;
    if (m.cool > 0) m.cool -= dt;
    if (!window.__freeze) (m.T.boss ? moveBoss : FREE() ? moveFree : moveEntity)(m, dt);
    if (state !== 'play') return;
    if (m.dead) continue;
    if (m.mode === 'attack') attackers++;
    if (themeKey === 'missile' && (m.mode === 'attack' || m.mode === 'cruise') && m.speed > 0.2) {
      m.puffT -= dt;
      if (m.puffT <= 0) { m.puffT = 0.04; puff(m.pos.clone().addScaledVector(m.heading, -0.38 * m.T.scale), 0.03, 0xcccccc, 1.4); }
    }
    poseModel(m, dt);
  }
  mosquitoes = mosquitoes.filter(m => !m.dead);
  updateLeft();
  if (beepQueue.length) { sfx('beep', Math.min(...beepQueue)); beepQueue = []; }

  if (actx) {
    const sorted = mosquitoes.slice().sort((a, b) => a.pos.distanceTo(camPos) - b.pos.distanceTo(camPos));
    sorted.forEach((m, i) => {
      if (i < MAX_VOICES) {
        if (!m.voice) m.voice = makeVoice(m.T.pitch * rand(0.95, 1.05), m.T.vol);
        const d = m.pos.distanceTo(camPos);
        const approach = m.mode === 'attack' ? Math.max(0, 1 - d / m.aggro) : 0;
        const pitchMul = themeKey === 'missile' ? 1 + approach * 0.8 + (m.mode === 'attack' ? 0.2 : -0.3) : 1 + approach * 0.25;
        const loud = m.mode === 'cruise' ? 0.75 : themeKey === 'missile' ? (m.mode === 'attack' ? 1 : 0.15) : (m.mode === 'attack' ? 1 : 0.55);
        moveVoice(m.voice, m.pos, loud, pitchMul);
      } else if (m.voice) { stopVoice(m.voice); m.voice = null; }
    });
  }

  if (mosquitoes.length) {
    const nearest = Math.min(...mosquitoes.map(m => m.pos.distanceTo(camPos)));
    if (FREE()) hintEl.textContent = nearest > 2.4 ? 'نزدیک‌ترین ' + theme.one + ' حدود ' + fa(Math.round(nearest)) + ' متر دوره.' : '';
    else if (attackers) hintEl.textContent = attackers > 1 ? fa(attackers) + ' تا ' + theme.one + ' دارن حمله می‌کنن!' : 'یه ' + theme.one + ' داره حمله می‌کنه!';
    else if (nearest > 2.4) hintEl.textContent = 'نزدیک‌ترین ' + theme.one + ' حدود ' + fa(Math.round(nearest)) + ' متر دوره. راه برو و دنبالش بگرد.' +
      (mode === 'sensor' && hasSensor && steps === 0 && levelTime > 6 ? ' (گوشی رو جلوت نگه دار و راه برو، قدم‌هات شمرده می‌شه)' : '');
    else hintEl.textContent = 'خیلی نزدیکی، دور و برت رو نگاه کن.';
  } else hintEl.textContent = '';

  for (const pt of particles) {
    pt.life -= dt;
    if (!pt.ring) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.9; pt.vy *= 0.9; if (pt.feather) pt.vy += 60 * dt; if (pt.bubble) pt.vy -= 80 * dt; }
    else pt.r += 180 * dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const pp of popups) { pp.life -= dt; pp.y -= 40 * dt; }
  popups = popups.filter(p => p.life > 0);
}

// ---------- Render ----------
const _v = V(), _iq = new THREE.Quaternion();
function project(p) {
  _iq.copy(camQ).invert();
  const v = _v.copy(p).sub(camPos).applyQuaternion(_iq);
  if (v.z > -0.05) return { behind: true, v: [v.x, v.y, v.z] };
  const z = -v.z;
  if (projM) {
    const P = projM;
    const cx = P[0] * v.x + P[4] * v.y + P[8] * v.z + P[12];
    const cy = P[1] * v.x + P[5] * v.y + P[9] * v.z + P[13];
    const cw = P[3] * v.x + P[7] * v.y + P[11] * v.z + P[15];
    return { x: (cx / cw + 1) / 2 * W, y: (1 - cy / cw) / 2 * H, depth: z, v: [v.x, v.y, v.z], f: P[5] * H / 2 };
  }
  return { x: W / 2 + (v.x / z) * focal, y: H / 2 - (v.y / z) * focal, depth: z, v: [v.x, v.y, v.z], f: focal };
}

function drawEdgeArrow(v, dist) {
  const ang = Math.atan2(-v[1], v[0] || 1e-3);
  const margin = 26, tx = Math.cos(ang), ty = Math.sin(ang);
  const s = Math.min(tx ? (W / 2 - margin) / Math.abs(tx) : Infinity, ty ? (H / 2 - margin) / Math.abs(ty) : Infinity);
  const danger = Math.max(0, Math.min(1, (2.5 - dist) / 2));
  const size = 10 + danger * 9;
  ctx.save();
  ctx.translate(W / 2 + tx * s, H / 2 + ty * s); ctx.rotate(ang);
  ctx.globalAlpha = 0.6 + danger * 0.4; ctx.fillStyle = '#ff3b3b';
  ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * 0.7, size * 0.7); ctx.lineTo(-size * 0.7, -size * 0.7); ctx.closePath(); ctx.fill();
  ctx.restore();
}

let _safeTop = null;
function safeTop() {
  if (_safeTop == null) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top);visibility:hidden';
    document.body.appendChild(d); _safeTop = Math.max(d.offsetHeight, 10); d.remove();
  }
  return _safeTop;
}
window.addEventListener('resize', () => { _safeTop = null; });

// underwater look: blue-green tint, swaying light shafts from above, rising bubbles
const bubbles = [];
function drawWater() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(40,170,200,.22)'); g.addColorStop(1, 'rgba(0,40,80,.42)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const x = W * (0.1 + i * 0.2) + Math.sin(time * 0.4 + i * 1.7) * 40, w = 30 + 25 * Math.sin(time * 0.3 + i);
    const lg = ctx.createLinearGradient(0, 0, 0, H * 0.8);
    lg.addColorStop(0, 'rgba(180,240,255,.16)'); lg.addColorStop(1, 'rgba(180,240,255,0)');
    ctx.fillStyle = lg; ctx.beginPath();
    ctx.moveTo(x - w * 0.3, 0); ctx.lineTo(x + w * 0.3, 0); ctx.lineTo(x + w * 2 + 60, H * 0.8); ctx.lineTo(x - w * 0.5 + 60, H * 0.8); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  if (bubbles.length < 26 && Math.random() < 0.3) bubbles.push({ x: Math.random() * W, y: H + 10, r: 1.5 + Math.random() * 4, v: 30 + Math.random() * 60, ph: Math.random() * 6 });
  ctx.strokeStyle = 'rgba(220,250,255,.55)'; ctx.lineWidth = 1.2;
  for (const b of bubbles) {
    b.y -= b.v / 60; b.x += Math.sin(time * 2 + b.ph) * 0.4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
  }
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].y < -10) bubbles.splice(i, 1);
}

function drawRadar() {
  const R = 50, cx = 16 + R, cy = safeTop() + 12 + R;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R / 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, -Math.PI / 2 - 0.5, -Math.PI / 2 + 0.5); ctx.closePath(); ctx.fill();
  const [fx, fz] = forwardFlat(), rx = -fz, rz = fx;
  const scale = R / Math.max(3, areaR);
  for (const m of mosquitoes) {
    if (m.T.ghost) continue;
    const dx = m.pos.x - camPos.x, dz = m.pos.z - camPos.z;
    let px = (dx * rx + dz * rz) * scale, py = -(dx * fx + dz * fz) * scale;
    const l = Math.hypot(px, py), edge = l > R - 4;
    if (edge) { px *= (R - 4) / l; py *= (R - 4) / l; }
    ctx.fillStyle = m.T.boss ? '#ff4fd8' : m.mode === 'attack' ? '#ff3b3b' : '#ffcf3f';
    ctx.globalAlpha = edge ? 0.55 : 1;
    ctx.beginPath(); ctx.arc(cx + px, cy + py, m.T.boss ? 6 : m.mode === 'attack' ? 4 : 3, 0, Math.PI * 2); ctx.fill();
  }
  if (crate) {
    const dx = crate.pos.x - camPos.x, dz = crate.pos.z - camPos.z;
    let px = (dx * rx + dz * rz) * scale, py = -(dx * fx + dz * fz) * scale;
    const l = Math.hypot(px, py); if (l > R - 5) { px *= (R - 5) / l; py *= (R - 5) / l; }
    ctx.globalAlpha = 1; ctx.fillStyle = '#50ffb0'; ctx.fillRect(cx + px - 4, cy + py - 4, 8, 8);
  }
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx + 4, cy + 4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function render(dt) {
  // 3D
  camera.position.copy(camPos); camera.quaternion.copy(camQ);
  if (projM) { camera.projectionMatrix.fromArray(projM); camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert(); }
  renderer.render(scene, camera);

  // shake on heavy impacts
  if (shake > 0) {
    shake -= dt; const k = shake * 30;
    overlayEl.style.transform = `translate(${rand(-k, k)}px, ${rand(-k, k)}px)`;
    if (shake <= 0) overlayEl.style.transform = '';
  }

  // 2D overlay: markers, arrows, radar, effects
  ctx.clearRect(0, 0, W, H);
  if (state === 'play' || state === 'over') {
    let closestAttack = Infinity;
    for (const m of mosquitoes) {
      const dist = m.pos.distanceTo(camPos);
      if (m.mode === 'attack') closestAttack = Math.min(closestAttack, dist);
      const pr = project(m.pos);
      const r = pr.behind ? 0 : (theme.size * m.T.scale * (m.grow || 1) * pr.f) / pr.depth;
      const on = !pr.behind && pr.x > -r && pr.x < W + r && pr.y > -r && pr.y < H + r;
      m.screen = on ? { x: pr.x, y: pr.y, r, depth: pr.depth } : null;
      if (on) {
        if (r < 12 && (!m.T.ghost || dist < 1.3)) {
          ctx.strokeStyle = m.mode === 'attack' ? 'rgba(255,60,60,.85)' : 'rgba(255,207,63,.65)';
          ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pr.x, pr.y, 16, 0, Math.PI * 2); ctx.stroke();
        }
        if (m.T.hp > 1 && !m.T.boss) for (let i = 0; i < m.T.hp; i++) {
          ctx.fillStyle = i < m.hp ? '#ffcf3f' : 'rgba(255,255,255,.3)';
          ctx.beginPath(); ctx.arc(pr.x + (i - (m.T.hp - 1) / 2) * 9, pr.y - Math.max(r, 12) - 8, 3, 0, Math.PI * 2); ctx.fill();
        }
      } else if (m.mode === 'attack' && !m.T.ghost) drawEdgeArrow(pr.v, dist);
    }
    if (closestAttack < 1.4 && state === 'play') {
      const a = Math.min(0.45, (1.4 - closestAttack) * 0.45) * (0.7 + 0.3 * Math.sin(time * 12));
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,0,0,${a})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (crate) {
      const pr = project(crate.pos);
      const r = pr.behind ? 0 : 0.12 * pr.f / pr.depth;
      crate.screen = !pr.behind && pr.x > -r && pr.x < W + r && pr.y > -r && pr.y < H + r ? { x: pr.x, y: pr.y, r } : null;
      if (crate.screen && r < 14) { ctx.strokeStyle = 'rgba(80,255,176,.85)'; ctx.lineWidth = 2; ctx.strokeRect(pr.x - 14, pr.y - 14, 28, 28); }
    }
    const boss = mosquitoes.find(m => m.T.boss);
    if (boss && state === 'play') {
      const bw = Math.min(220, W - 200), bx = (W - bw) / 2, by = safeTop() + 18;
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 14);
      ctx.fillStyle = '#ff3b3b'; ctx.fillRect(bx, by, bw * Math.max(0, boss.hp) / boss.maxHp, 10);
      ctx.font = 'bold 13px Vazirmatn, Tahoma, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText('غول', W / 2, by + 28);
    }
    if (power && power.kind === 'shield') {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
      g.addColorStop(0, 'rgba(80,200,255,0)'); g.addColorStop(1, `rgba(80,200,255,${0.25 + 0.1 * Math.sin(time * 6)})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (themeKey === 'shark') drawWater();
    if (state === 'play') drawRadar();
  }
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, pt.life * 2));
    if (pt.ring) { ctx.strokeStyle = pt.c || 'rgba(255,255,255,.8)'; ctx.lineWidth = pt.c ? 5 : 2; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.stroke(); }
    else if (pt.feather) { ctx.fillStyle = pt.c; ctx.beginPath(); ctx.ellipse(pt.x, pt.y, pt.r * 2, pt.r * 0.7, pt.life * 6, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = pt.c; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 18px Vazirmatn, Tahoma, sans-serif'; ctx.textAlign = 'center';
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 2);
    ctx.font = pp.big ? 'bold 30px Vazirmatn, Tahoma, sans-serif' : 'bold 18px Vazirmatn, Tahoma, sans-serif';
    ctx.fillStyle = '#000'; ctx.fillText(pp.text, pp.x + 1, pp.y + 1);
    ctx.fillStyle = '#ffcf3f'; ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
}

function step(dt) { update(dt); render(dt); }
function loop(t) {
  if (xrSession) return;
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  step(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- Start ----------
try { const b = +localStorage.getItem('vizviz_best'); if (b) $('best').textContent = '🏆 ' + fa(b); } catch (_) {}
$('sizes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const x of $('sizes').children) x.classList.toggle('on', x === b);
  areaR = +b.dataset.r;
});
$('themes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  themeKey = b.dataset.t;
  try { localStorage.setItem('vizviz_theme', themeKey); } catch (_) {}
  applyTheme();
});
$('modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  gameMode = b.dataset.m;
  try { localStorage.setItem('vizviz_mode', gameMode); } catch (_) {}
  applyMode();
});
applyMode();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let canXR = false;
xrSupported().then(ok => {
  canXR = ok;
  $('modeNote').textContent = ok
    ? 'گوشیت از واقعیت افزوده‌ی کامل پشتیبانی می‌کنه: راه رفتنت دقیق دنبال می‌شه.'
    : 'راه رفتنت با شمردن قدم‌ها دنبال می‌شه. گوشی رو جلوت نگه دار و آروم راه برو.';
});

async function begin() {
  $('startScreen').classList.add('hidden');
  $('overScreen').classList.add('hidden');
  $('hud').classList.remove('hidden');
  if (!actx) initAudio();
  if (actx && actx.state === 'suspended') actx.resume();
  let xrOk = false;
  if (canXR) { try { await startXR(); xrOk = true; } catch (err) { console.warn('XR failed, using sensors', err); } }
  if (!xrOk) await Promise.all([enableSensors(), startCamera()]);
  scene.fog = themeKey === 'shark' ? new THREE.Fog(0x0b4a66, 1.2, 9) : null;
  state = 'play';
  resetGame();
}
function exitToMenu() {
  if (state !== 'play') return;
  state = 'menu';
  clearWorld();
  $('hud').classList.add('hidden');
  hintEl.textContent = ''; bannerEl.style.opacity = 0;
  $('overScreen').classList.add('hidden');
  $('startScreen').classList.remove('hidden');
  try { const b = +localStorage.getItem('vizviz_best'); if (b) $('best').textContent = '🏆 ' + fa(b); } catch (_) {}
  if (xrSession) xrSession.end().catch(() => {});
}
$('exitBtn').addEventListener('click', exitToMenu);
$('startBtn').addEventListener('click', begin);
$('helpBtn').addEventListener('click', () => $('helpScreen').classList.remove('hidden'));
$('helpClose').addEventListener('click', () => $('helpScreen').classList.add('hidden'));
$('againBtn').addEventListener('click', begin);

window.__vizviz = {
  get state() { return state; }, get mosquitoes() { return mosquitoes; }, get score() { return score; },
  get health() { return health; }, get level() { return level; }, set level(v) { level = v; }, camPos, camQ, swat,
  get crate() { return crate; }, get power() { return power; }, set crateAt(v) { crateAt = v; }, get slowmo() { return slowmoT; },
  get lookYaw() { return lookYaw; }, set lookYaw(v) { lookYaw = v; }, set lookPitch(v) { lookPitch = v; }
};
</script>
